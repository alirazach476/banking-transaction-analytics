name: novabank_analytics
version: '1.0.0'
config-version: 2

profile: novabank

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

on-run-start:
  - "CREATE SCHEMA IF NOT EXISTS intermediate"

models:
  novabank_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    warehouse:
      +schema: warehouse
      dimensions:
        +materialized: table
      facts:
        +materialized: incremental
        +incremental_strategy: delete+insert
    analytics:
      +materialized: table
      +schema: analytics

vars:
  date_spine_start: '2020-01-01'
  date_spine_end: '2030-12-31'
