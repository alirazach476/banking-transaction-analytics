version: 2

models:
  - name: int_transaction_enriched
    description: Core transactions enriched with customer, account, branch, and merchant attributes
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null

  - name: int_customer_transaction_metrics
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: int_account_transaction_metrics
    columns:
      - name: account_id
        tests:
          - unique
          - not_null

  - name: int_daily_transaction_metrics
    columns:
      - name: transaction_date
        tests:
          - unique
          - not_null

  - name: int_anomaly_features
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
