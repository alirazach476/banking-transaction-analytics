version: 2
models:
  - name: stg_payment_transactions
    columns:
      - name: payment_id
        tests: [unique, not_null]
  - name: stg_payment_lifecycle_events
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: event_type
        tests:
          - accepted_values:
              values: [AUTH_REQUEST, AUTH_RESPONSE, CLEARING, SETTLEMENT, REVERSAL, REFUND, CHARGEBACK]
  - name: stg_payment_settlements
    columns:
      - name: settlement_id
        tests: [not_null]
  - name: int_payment_outcomes
    columns:
      - name: payment_id
        tests: [unique, not_null]
  - name: mart_payment_kpis_daily
    columns:
      - name: payment_date
        tests: [unique, not_null]
  - name: mart_settlement_daily
    columns:
      - name: settlement_date
        tests: [unique, not_null]
  - name: mart_reconciliation_sql
    columns:
      - name: cleared_payments
        tests: [not_null]
